<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge — Log in or sign up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-shell">

    <!-- Left: brand moment. This is the one place the design gets to be bold. -->
    <section class="auth-visual">
      <svg class="auth-visual__mark-bg" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M10 70 Q50 20 90 70" fill="none" stroke="#FAF8F4" stroke-width="6"/>
        <path d="M10 82 Q50 40 90 82" fill="none" stroke="#FAF8F4" stroke-width="6"/>
      </svg>

      <a class="logo" href="catalog.html" aria-label="Back to SkillBridge">
        <svg class="logo__mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 15 Q12 4 22 15" fill="none" stroke="#E8A33D" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span class="logo__word-skill">Skill</span><span class="logo__word-bridge">Bridge</span>
      </a>

      <p class="auth-visual__quote">Practical skills for <em>right now</em> — not someday.</p>

      <p class="auth-visual__footnote">Tech, design, and creative courses built for students figuring it out as they go.</p>
    </section>

    <!-- Right: the actual form -->
    <section class="auth-form-panel">
      <div class="auth-card">

        <!-- Sign Up is the default tab: most visitors here are new, not returning. -->
        <div class="auth-tabs">
          <button class="auth-tab" id="tab-login" type="button">Log in</button>
          <button class="auth-tab is-active" id="tab-signup" type="button">Sign up</button>
        </div>

        <!-- Log in form (hidden by default) -->
        <form id="login-form" class="stack" style="display: none;">
          <h1 class="auth-card__heading">Welcome back</h1>
          <p class="auth-card__subheading">Log in to pick up where you left off.</p>

          <div>
            <label class="auth-card__field-label" for="login-email">Email</label>
            <input class="input" type="email" id="login-email" placeholder="you@example.com" required />
          </div>
          <div>
            <label class="auth-card__field-label" for="login-password">Password</label>
            <input class="input" type="password" id="login-password" placeholder="••••••••" required />
          </div>

          <button class="btn btn--primary btn--block" type="submit">Log in</button>
        </form>

        <!-- Sign up form (shown by default) -->
        <form id="signup-form" class="stack">
          <h1 class="auth-card__heading">Create your account</h1>
          <p class="auth-card__subheading">Free to join — you only pay for premium courses.</p>

          <div>
            <label class="auth-card__field-label" for="signup-name">Full name</label>
            <input class="input" type="text" id="signup-name" placeholder="Your name" required />
          </div>
          <div>
            <label class="auth-card__field-label" for="signup-email">Email</label>
            <input class="input" type="email" id="signup-email" placeholder="you@example.com" required />
          </div>
          <div>
            <label class="auth-card__field-label" for="signup-password">Password</label>
            <input class="input" type="password" id="signup-password" placeholder="At least 6 characters" required />
          </div>

          <button class="btn btn--gold btn--block" type="submit">Create account</button>
        </form>

      </div>
    </section>

  </div>

  <script type="module">
    import { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "./js/firebase-config.js";

    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('is-active');
      tabSignup.classList.remove('is-active');
      loginForm.style.display = 'flex';
      signupForm.style.display = 'none';
    });

    tabSignup.addEventListener('click', () => {
      tabSignup.classList.add('is-active');
      tabLogin.classList.remove('is-active');
      signupForm.style.display = 'flex';
      loginForm.style.display = 'none';
    });

    function showError(form, message) {
      let errorEl = form.querySelector('.form-error');
      if (!errorEl) {
        errorEl = document.createElement('p');
        errorEl.className = 'form-error';
        form.prepend(errorEl);
      }
      errorEl.textContent = message;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'catalog.html';
      } catch (err) {
        showError(loginForm, 'Could not log in — check your email and password.');
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        window.location.href = 'catalog.html';
      } catch (err) {
        showError(signupForm, 'Could not create account — try a different email or a stronger password.');
      }
    });
  </script>

</body>
</html>
